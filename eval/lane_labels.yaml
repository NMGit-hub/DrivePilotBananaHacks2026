# Hand-labeled lane position on highway / multi-lane frames (V2-M5), for scripts/eval_lanes.py index.
# Labeled by looking at each frame (scripts/eval_lanes.py frames: every 6 s from t=3 s, 960 px wide).
#   index: our lane counted from the left (1 = leftmost lane of our direction)
#   count: lanes in our direction, only where the right edge is clearly visible too (null: not sure)
# Frames that couldn't be labeled confidently are left out (blocked view, intersections, gores, a rolled camera
# in the city). Videos: data/videos/<folder>/<file>; GPS: data/gps/<id>.gpx.
