# Hand labels for the "find me a parking spot" feature on the user's own Mercedes dashcam clips (category parking_lot in
# data/videos/own/selection.csv). Videos: data/videos/own/<id>.mp4 (1920x1280, 25 fps, ~96 deg wide, pitched up),
# GPS: data/gps/<id>.gpx (read from the dashcam's burned-in overlay; scripts/dashcam_gpx.py).
# Labeled 2026-10-11 by one Claude subagent from 1-2 s contact sheets (lower part of the frame, GPX speed stamped on
# each tile; 4-6 s through stretches outside lots) + full-resolution crops (PyAV seek); the first five clips were
# re-checked once by the same labeler. NOT yet spot-checked by a second person/pass. Times are video seconds.
# 13 clips (all 13 parking_lot rows of selection.csv as of 13:30): 19 open spots (12 clear, 7 ambiguous; in the 12 usable clips 16: 10 clear, 6 ambiguous).
# Schema: exactly eval/parking_labels.yaml's:
#   scene: lot_aisles | lot_other | street | garage | other;  usable: false = night/glare/rain, don't score
#   in_lot: [[t0, t1]]; parked_at: when our car comes to rest in a space (or null)
#   open_spots: the row next to our path, <= ~6 stalls ahead: side, kind (stall|curb), t_visible (first clearly
#     visible AND empty), t_pass (leaves the frame; null = never), restriction (none|handicap|ev|reserved|compact|
#     fire_lane|no_parking|unknown), neighbor_before, stalls (adjacent run), certainty (clear|ambiguous)
#   look_alikes: things that must NOT be called open spots (false-alarm tests); pulling_out: other cars backing out
# Labeler's notes: the wide lens makes stalls ahead visible for a long time, so t_pass is often null (still in frame
# when we stop/park); times +-0.5-1 s; stall counts on runs +-1-2. Ignore the date/GPS text bar at the bottom.
# Unusable: dm_20260925_142925 (rain on the windshield; readable, a possible hard case). Best positives:
# dm_20260917_172351 (near-empty strip-mall lot, at 15-20 mph), dm_20261004_135013, dm_20260928_183141,
# dm_20261005_175210. Clean negatives (driven through a lot without passing an empty adjacent stall):
# dm_20260926_142055 (unmarked gravel lot), dm_20260927_154030 and dm_20260925_133641 (shopping-center internal roads),
# dm_20261003_173624 (garage, a hard case for lighting). The user's own car parks in dm_20260925_134241 (55.5 s) and
# dm_20261004_135013 (64 s); dm_20261005_175210 and dm_20260930_152951 end waiting in an aisle (parked_at null).
