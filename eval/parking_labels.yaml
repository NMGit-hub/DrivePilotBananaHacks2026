# Hand labels for the "find me a parking spot" feature (V2-M1): 40 BDD100K clips tagged "parking lot".
# Videos: data/videos/parking_lot/<id>.mov, GPS: data/gps/<id>.gpx (fetch both with
#     .venv/Scripts/python scripts/find_bdd_clips.py --scene "parking lot" --min-slow-s 15 --limit 426 --fetch 40).
# Labeled 2026-10-10 by two Claude subagents from contact sheets + zoomed full-resolution frames
# (scripts/contact_sheet.py); NOT yet spot-checked by a second pass (see HANDOFF.md). Times are video seconds.
#   scene: lot_aisles | lot_other | street | garage | other;  usable: false = night/glare/rain, don't score
#   in_lot: [[t0, t1]]; parked_at: when our car comes to rest in a space (or null)
#   open_spots: the row next to our path, <= ~6 stalls ahead: side, kind (stall|curb), t_visible (first clearly
#     visible AND empty), t_pass (leaves the frame; null = never), restriction (none|handicap|ev|reserved|compact|
#     fire_lane|no_parking|unknown), neighbor_before, stalls (adjacent run), certainty (clear|ambiguous)
#   look_alikes: things that must NOT be called open spots (false-alarm tests); pulling_out: other cars backing out
# Labelers' notes: stall counts on long runs are +-1-2; in fast clips (46021ee2, 4025360f, a0eace64) single gaps are
# visible ~0.5-1 s, so times may be off by 0.5 s. Not US despite the tag: 1fcadd07, 27f5a0bf, 664ab48c; not a lot:
# 5022e6cc. Best positives: 056db1a0, 4025360f, a0b98409, a0eace64, 46021ee2, 509bdcdf. Clean negatives: 18add974,
# 345cd125, 3043475a, 161d0d48, 6360329d, 657bfe8f, a4c6b745, 592aaebe, 9997fe0b, a8db5ab8.
