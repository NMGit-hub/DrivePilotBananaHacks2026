# Hand-labeled lane position on the user's own Mercedes dashcam highway clips, for scripts/eval_lanes.py index.
# Labeled 2026-10-11 by a Claude Code subagent, looking at each frame: every 6 s from t=3 s, the road band of the
# frame (rows ~0.62-0.95 of the 1920x1280 frame, full width, shown at 1200 px wide; zoomed crops where needed).
#   index: our lane counted from the left (1 = leftmost lane of our direction)
#   count: lanes in our direction, only where the right edge is clearly visible too (null: not sure)
# Frames that couldn't be labeled confidently are left out (blocked view, gores/merges, mid lane change, ramps,
# lines not readable at night or in glare). Videos: data/videos/<file> (folder own/); camera ~96 deg wide,
# pitched up (road in the lower ~35 % of the frame). Night clips were contrast-stretched before labeling.
# dm_20260918_203008 (night, rightmost lane of a wide freeway, left edge never readable) has no labels and is
# left out. Index is the reliable field; count is filled in only where the right edge was clearly visible.
