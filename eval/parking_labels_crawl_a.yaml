# Hand labels for the "find me a parking spot" feature (V2-M1), batch "crawl A": 16 BDD100K clips tagged "parking lot"
# whose GPS crawls at parking-search speed. Videos: data/videos/parking_crawl/<id>.mov, GPS: data/gps/<id>.gpx (fetched
# with scripts/find_bdd_clips.py --min-crawl-s ... --out parking_crawl; see its docstring).
# Labeled 2026-10-10 by a Claude subagent, same method and schema as eval/parking_labels.yaml: 1-s and 0.5-s contact sheets
# plus full-resolution frames and zoomed crops (scripts/contact_sheet.py), GPS speed/course from the GPX as a cross-check;
# NOT yet spot-checked by a second pass. Times are video seconds. Field meanings: see the header of eval/parking_labels.yaml.
# Labeler's notes: half of this batch is not a parking lot despite the tag (gas-station forecourts 256333e8, 2e1a2a13,
# 47b35d90; truck yard 00810e80) or is night/rain (22b4f5e6, 2e8a9f68, 4c29e447, 4feec415, 27ea48ed); 4feec415 is in
# Israel. Some clips go faster than 8 mph for stretches (27ea48ed, 2e8a9f68, 256333e8, 47b35d90 reach 5-7 m/s on streets).
# Few open spots: the only clear ones are the stalls we park in (0886ed1c at ~39.5 s, right at the clip end; 1525b9a6).
# Clean negatives (day, full rows beside the path): 2f236977 (covered IKEA garage), 2f4afe73 (shopping-centre aisle; a
# dashboard reflection covers the right half), 3f225bea (short). A camera-mount blob covers the top-right of 5749b012
# and 57c2776b; 4c29e447 is a bouncing taxi dashcam.
