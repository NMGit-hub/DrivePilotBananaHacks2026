# DrivePilot configuration. API keys are NOT stored here: they come from environment variables / .env
# (ANTHROPIC_API_KEY, MAPBOX_ACCESS_TOKEN, GEMINI_API_KEY). Relative paths resolve against this file's folder.
# Unknown keys are rejected at startup, so typos fail loudly. Sections grow milestone by milestone.

video:
  source: file              # the one switch: "camera" (phone via scrcpy) or "file" (recorded drive)
  file:
    path: data/videos/dev_clip.mov
    gpx_path: null          # optional GPX track recorded with the clip
    gpx_offset_s: 0.0       # GPX time at video t=0 minus the first GPX point time
    realtime: true          # play at real-time speed; drop frames if processing falls behind
    start_s: 0.0
    loop: false
  camera:
    scrcpy_dir: null        # folder with adb.exe + scrcpy-server; null = auto-detect the winget install
    camera_id: 3            # OnePlus 12: 3 = the physical ultrawide (same view as logical camera 0 at zoom 0.6,
    camera_zoom: 1.0        #   but it can't switch lenses by itself mid-drive)
    width: 1920
    height: 1080
    fps: 30
    bitrate_mbps: 8.0
    stall_timeout_s: 3.0    # no video bytes for this long = camera stalled (error, the app restarts it)
    decoder: auto           # auto = hardware H.264 decoding (D3D11VA, then CUDA), software as a last resort

gps:
  source: auto              # auto = GPX in file mode (if gpx_path is set), phone page in camera mode
  stale_s: 3.0              # a phone fix older than this is ignored

nav:                        # Mapbox routing, rerouting and spoken guidance
  profile: driving-traffic
  country: us               # destination search limited to this country (null = anywhere)
  timeout_s: 5.0
  off_route_m: 50.0         # PLAN.md: more than ~50 m from the route for 5 s = reroute
  off_route_s: 5.0
  reroute_cooldown_s: 20.0
  snap_window_m: 500.0      # snap near where we were (routes can loop back on themselves)
  max_backtrack_m: 50.0     # a bigger jump backwards along the route is GPS noise
  arrival_m: 30.0           # arrived within 30 m of the route's end, or 60 m in a straight line (parking lots)
  arrival_radius_m: 60.0
  near_end_m: 150.0         # leaving the route this close to the end = we turned in (arrived, no reroute)
  join_slack_m: 100.0       # starting off the road: "off route" only when this much further from it than at the start
  home: null                # address for "take me home" (null: it asks for the address)
  lane_reminders_m: [1609.0, 402.0]  # PLAN.md: lane reminders ~1 mile and ~0.25 mile before a junction

perception:
  weights: models/yolo26s.pt  # downloaded on first run
  engine: tensorrt          # tensorrt (~10x faster on Windows; built once, ~7 min) | pytorch
  engine_workspace_gb: 4.0
  device: 0                 # CUDA device; the pipeline refuses to run on the CPU
  half: true
  imgsz: [384, 640]         # inference height, width (multiples of 32); 16:9 frames letterbox to this
  conf: 0.25
  iou: 0.7
  classes: [car, truck, bus, motorcycle, stop sign, traffic light, person, bicycle]
  vehicle_dedup_iou: 0.7    # one pickup reported as both "car" and "truck" -> keep the more confident box
  tracker:                  # ByteTrack
    track_high_thresh: 0.25
    track_low_thresh: 0.1
    new_track_thresh: 0.25
    track_buffer_s: 1.5     # keep lost tracks this long (occlusion by crossing traffic)
    match_thresh: 0.8
    fuse_score: true

ego_motion:                 # "are we stopped?" from optical flow on a small frame copy
  work_width: 320
  roi_top: 0.30             # ignore sky above / hood below these fractions of the height
  roi_bottom: 0.85
  box_margin: 0.15          # mask out detected objects (they move on their own), grown by this fraction
  max_points: 300
  min_points: 20
  fb_max_error_px: 1.0
  min_dt_s: 0.0167          # floor on the frame time step for per-second rates (bursty live frames)
  metric: combined          # max(zoom x zoom_weight, horizontal flow); see perception/ego_motion.py
  zoom_weight: 50.0
  baseline_s: 0.6           # measure motion against the frame 0.6 s ago: ~10x lower noise while stopped
  stopped_below: 1.5        # calibrated on hand-labeled stops: scripts/eval_ego_motion.py
  moving_above: 3.0
  stopped_after_s: 0.5      # PLAN.md: stopped when the background barely moves for 0.5 s
  smoothing_s: 0.2          # rolling median removes one-frame glitches

vehicle_motion:             # is each tracked car stopped? (box heights per second, ego motion compensated)
  window_s: 0.6
  stopped_below: 0.12
  moving_above: 0.35
  stopped_after_s: 0.5      # PLAN.md: a car is stopped after 0.5 s of stillness
  still_radius: 0.1         # dates the stop: when the car came within this many box heights of where it rests
  noise_px_per_s: 10.0      # detector box jitter: small (distant) cars need at least this many px/s to count as moving

intersection:               # where waiting cars are relative to us, and when we are "at a stop sign"
  side_x: 0.30              # left/right zones = outer 30 % of the width (cross-street cars seen side-on)
  lead_min_height: 0.10     # a centered car seen from behind, this big (closer than ~9 m), is in front of us in our lane:
  max_lead_aspect: 1.9      #   we're queued behind it, not at the stop line
  stop_sign_min_conf: 0.45
  stop_sign_memory_s: 10.0  # at a stop = stopped within 10 s of seeing a stop sign
  camera_hfov_deg: 114.0    # OnePlus 12 ultrawide; below ~100° answers warn that the sides may be out of view

stop_queue:                 # 4-way stop: who goes first
  tie_window_s: 1.0         # PLAN.md: stops within 1 s are a tie; the car on the right goes first
  depart_moving_s: 1.0      # a car has gone when it keeps moving 1 s and 1.5 box heights (a creep to the line is less),
  depart_moved: 1.5         #   or drives out of its approach zone / out of view while moving
  lost_timeout_s: 8.0       # a hidden car (crossing traffic) keeps its place this long
  parked_after_s: 20.0      # a car ahead that hasn't moved for 20 s since we arrived is probably parked (no alert)
  ego_depart_s: 1.5         # moving this long = we left (creeping forward to see is not leaving)

traffic_light:              # light color from the lit lamp; "tell me when it's green"
  stable_s: 0.5             # reported color = majority over this window
  green_confirm_frames: 5   # consecutive green frames after red/yellow, while stopped = "turned green"
  red_memory_s: 5.0
  anchor_pad: 0.15          # while stopped, lights are read at a remembered (padded) box even if YOLO misses them

alerts:                     # spoken on their own: "You're up, check and go." / "Light's green, ..." (when asked)
  cooldown_s: 15.0          # never the same alert twice within this time (once per event)
  watch_timeout_s: 300.0    # "tell me when it's green" requests expire after 5 minutes

vision_model: claude        # scene-question provider: claude (Haiku, default) | gemini | ollama | mock
vision:
  frames: 3                 # latest frame at full width + 2 earlier, smaller ones (motion, things just passed)
  frame_spacing_s: 0.7
  sign_frame_spacing_s: 1.2 # "what did that sign say?": reach further back, at full width
  latest_width: 1280
  older_width: 640
  jpeg_quality: 80
  first_token_timeout_s: 3.0  # no words by then: a spoken "sorry" (PLAN target: answer audio within 2.5 s)
  total_timeout_s: 8.0
  time_override: null       # e.g. "Saturday 17:40" for replays and the test sheet (default: the real clock)
  temperature: 0.0          # 0 = most literal (fewer invented details); null for Claude models newer than
                            #   the 4.6 line, which reject it (the startup check would show it failing)
  claude:
    model: claude-haiku-4-5
    max_tokens: 300
    max_retries: 0          # a retry can't arrive in time; failures get a spoken fallback instead
  gemini:
    model: gemini-3.8-flash
    thinking_level: low
    max_tokens: 300
  ollama:
    model: qwen2.5vl:7b     # note: a 7B vision model won't fit in 6 GB next to YOLO and Whisper
    host: http://localhost:11434
    timeout_s: 15.0

voice:
  input_device: null        # sounddevice name or index; null = system default
  output_device: null
  output_volume: 1.0        # 0-1; benchmarks run quieter
  wakeword:                 # "Hey DrivePilot" (openWakeWord model trained by scripts/wakeword)
    model: models/wakeword/hey_drivepilot.onnx
    threshold: 0.15         # real voices (scripts/wakeword/check_real.py): 0.25 missed clear takes; still 0
                            #   false wakes per hour on 21 h of speech + car noise down to 0.10 (metrics.json)
    debounce_s: 2.0
  endpoint:                 # when the question has ended (Silero VAD)
    speech_threshold: 0.5
    end_silence_s: 0.5      # PLAN.md says ~0.6 s; 0.5 keeps local answers under 1 s and cut off none of the real takes
    speculative_silence_s: 0.25  # start transcribing early; kept if the silence lasts
    no_speech_timeout_s: 4.0
    wake_tail_s: 0.4         # speech this soon after the wake word may be just "...pilot": then the question
    wake_pause_s: 1.2        #   ends only after 1.2 s of silence (a pause before the question isn't its end)
    max_utterance_s: 10.0
    pre_roll_s: 1.5         # the whole wake phrase goes to Whisper (a cut one garbles the question's first word)
  stt:                      # faster-whisper on the GPU
    model: small.en
    device: cuda
    compute_type: float16
    beam_size: 1
    max_new_tokens: 64      # questions are short; bounds decode time
  tts:                      # Piper; alerts are pre-rendered clips
    voice: models/piper/en_US-lessac-medium.onnx
    length_scale: 0.95
    clips_dir: models/piper/clips
    chime_volume: 0.25
    listen_chime: true

ui:
  host: 127.0.0.1
  port: 8000

logging:
  level: INFO
  runs_dir: runs            # each run writes frames, detections, questions, answers and timings here
  frame_log_interval_s: 1.0

signs:                      # V2-M6 fine-tuned US sign detector (perception/signs.py; scripts/signs/README.md)
  weights: models/signs/signs_yolo26s.pt          # detector (13 MUTCD kinds); engine built next to it
  classifier_weights: models/signs/speed_value_cls.pt  # speed-limit value (5-85 mph) or "none"
  engine: tensorrt          # tensorrt | pytorch (eager, much slower on Windows)
  device: 0
  half: true
  imgsz: [736, 1280]        # whole frame at 1280 px wide: distant signs stay ~15-40 px tall
  classifier_imgsz: 96
  conf: 0.4                 # minimum detection confidence (per-kind overrides in class_conf)
  class_conf: {}
  iou: 0.6
  value_conf: 0.98          # a speed value is reported only above this classifier probability (chosen on validation)...
  value_min_px: 16.0        # ...and only for signs at least this tall (pixels at 1280 px frame width)
