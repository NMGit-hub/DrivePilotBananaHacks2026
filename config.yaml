# DrivePilot configuration. API keys are NOT stored here: they come from environment variables / .env
# (ANTHROPIC_API_KEY, MAPBOX_ACCESS_TOKEN, GEMINI_API_KEY). Relative paths resolve against this file's folder.
# Unknown keys are rejected at startup, so typos fail loudly. Sections grow milestone by milestone.

video:
  source: file              # the one switch: "camera" (phone via scrcpy) or "file" (recorded drive)
  file:
    path: data/videos/dev_clip.mov
    gpx_path: null          # optional GPX track recorded with the clip
    gpx_offset_s: 0.0       # GPX time at video t=0 minus the first GPX point time
    realtime: true          # play at real-time speed; drop frames if processing falls behind
    start_s: 0.0
    loop: false             # play the clip again and again; the clock runs on across passes, so a GPX longer
                            #   than the clip (a simulated drive, scripts/route_to_gpx.py) plays to its end
    hfov_deg: 60.0          # the recorded camera's field of view: BDD100K dashcams ~60° (parking and pedestrian
                            #   geometry); null = the phone's (intersection.camera_hfov_deg) for our own drives
  camera:
    scrcpy_dir: null        # folder with adb.exe + scrcpy-server; null = auto-detect the winget install
    camera_id: 3            # OnePlus 12: 3 = the physical ultrawide (same view as logical camera 0 at zoom 0.6,
    camera_zoom: 1.0        #   but it can't switch lenses by itself mid-drive)
    width: 1920
    height: 1080
    fps: 30
    bitrate_mbps: 8.0
    stall_timeout_s: 3.0    # no video bytes for this long = camera stalled (error, the app restarts it)
    decoder: auto           # auto = hardware H.264 decoding (D3D11VA, then CUDA), software as a last resort

gps:
  source: auto              # auto = GPX in file mode (if gpx_path is set), phone page in camera mode
  stale_s: 3.0              # a phone fix older than this is ignored

nav:                        # Mapbox routing, rerouting and spoken guidance
  profile: driving-traffic
  country: us               # destination search limited to this country (null = anywhere)
  timeout_s: 5.0
  off_route_m: 50.0         # PLAN.md: more than ~50 m from the route for 5 s = reroute
  off_route_s: 5.0
  reroute_cooldown_s: 20.0
  snap_window_m: 500.0      # snap near where we were (routes can loop back on themselves)
  max_backtrack_m: 50.0     # a bigger jump backwards along the route is GPS noise
  arrival_m: 30.0           # arrived within 30 m of the route's end, or 60 m in a straight line (parking lots)
  arrival_radius_m: 60.0
  near_end_m: 150.0         # leaving the route this close to the end = we turned in (arrived, no reroute)
  join_slack_m: 100.0       # starting off the road: "off route" only when this much further from it than at the start
  home: null                # address for "take me home" (null: it asks for the address)
  lane_reminders_m: [1609.0, 402.0]  # PLAN.md: lane reminders ~1 mile and ~0.25 mile before a junction
  turn_prompts_m: [800.0, 150.0]     # turn-by-turn (alerts.auto.turns): "In half a mile, turn right onto ..."

perception:
  weights: models/yolo26s.pt  # downloaded on first run
  engine: tensorrt          # tensorrt (~10x faster on Windows; built once, ~7 min) | pytorch
  engine_workspace_gb: 4.0
  device: 0                 # CUDA device; the pipeline refuses to run on the CPU
  half: true
  imgsz: [384, 640]         # inference height, width (multiples of 32); 16:9 frames letterbox to this
  conf: 0.25
  iou: 0.7
  classes: [car, truck, bus, motorcycle, stop sign, traffic light, person, bicycle]
  vehicle_dedup_iou: 0.7    # one pickup reported as both "car" and "truck" -> keep the more confident box
  tracker:                  # ByteTrack
    track_high_thresh: 0.25
    track_low_thresh: 0.1
    new_track_thresh: 0.25
    track_buffer_s: 1.5     # keep lost tracks this long (occlusion by crossing traffic)
    match_thresh: 0.8
    fuse_score: true

ego_motion:                 # "are we stopped?" from optical flow on a small frame copy
  work_width: 320
  roi_top: 0.30             # ignore sky above / hood below these fractions of the height
  roi_bottom: 0.85
  box_margin: 0.15          # mask out detected objects (they move on their own), grown by this fraction
  max_points: 300
  min_points: 20
  fb_max_error_px: 1.0
  min_dt_s: 0.0167          # floor on the frame time step for per-second rates (bursty live frames)
  metric: combined          # max(zoom x zoom_weight, horizontal flow); see perception/ego_motion.py
  zoom_weight: 50.0
  baseline_s: 0.6           # measure motion against the frame 0.6 s ago: ~10x lower noise while stopped
  stopped_below: 1.5        # calibrated on hand-labeled stops: scripts/eval_ego_motion.py
  moving_above: 3.0
  stopped_after_s: 0.5      # PLAN.md: stopped when the background barely moves for 0.5 s
  smoothing_s: 0.2          # rolling median removes one-frame glitches

vehicle_motion:             # is each tracked car stopped? (box heights per second, ego motion compensated)
  window_s: 0.6
  stopped_below: 0.12
  moving_above: 0.35
  stopped_after_s: 0.5      # PLAN.md: a car is stopped after 0.5 s of stillness
  still_radius: 0.1         # dates the stop: when the car came within this many box heights of where it rests
  noise_px_per_s: 10.0      # detector box jitter: small (distant) cars need at least this many px/s to count as moving

intersection:               # where waiting cars are relative to us, and when we are "at a stop sign"
  side_x: 0.30              # left/right zones = outer 30 % of the width (cross-street cars seen side-on)
  lead_min_height: 0.10     # a centered car seen from behind, this big (closer than ~9 m), is in front of us in our lane:
  max_lead_aspect: 1.9      #   we're queued behind it, not at the stop line
  stop_sign_min_conf: 0.45
  stop_sign_memory_s: 10.0  # at a stop = stopped within 10 s of seeing a stop sign
  camera_hfov_deg: 114.0    # OnePlus 12 ultrawide; below ~100° answers warn that the sides may be out of view

stop_queue:                 # 4-way stop: who goes first
  tie_window_s: 1.0         # PLAN.md: stops within 1 s are a tie; the car on the right goes first
  depart_moving_s: 1.0      # a car has gone when it keeps moving 1 s and 1.5 box heights (a creep to the line is less),
  depart_moved: 1.5         #   or drives out of its approach zone / out of view while moving
  lost_timeout_s: 8.0       # a hidden car (crossing traffic) keeps its place this long
  parked_after_s: 20.0      # a car ahead that hasn't moved for 20 s since we arrived is probably parked (no alert)
  ego_depart_s: 1.5         # moving this long = we left (creeping forward to see is not leaving)

traffic_light:              # light color from the lit lamp; "tell me when it's green"
  stable_s: 0.5             # reported color = majority over this window
  green_confirm_frames: 5   # consecutive green frames after red/yellow, while stopped = "turned green"
  red_memory_s: 5.0
  anchor_pad: 0.15          # while stopped, lights are read at a remembered (padded) box even if YOLO misses them

alerts:                     # spoken on their own: "You're up, check and go." / "Light's green, ..." (when asked)
  cooldown_s: 15.0          # never the same alert twice within this time (once per event)
  watch_timeout_s: 300.0    # "tell me when it's green" requests expire after 5 minutes
  safety_gap_s: 3.0         # a pedestrian warning repeating the last one within 3 s (same kind and side: a group
                            #   crossing) is said once; another kind or the other side is said
  auto:                     # said without being asked (each also switchable on the page, Settings); pedestrian and
                            #   drift warnings are always on. Muted in quiet mode, except turns and wrong lane.
    light_green: true       # "Light's green." when our light turns green while we wait at it
    car_ahead: true         # "The car ahead is moving." stopped behind a car that pulls away while we stay put
    turns: true             # turn-by-turn while navigating (nav.turn_prompts_m)
    wrong_lane: true        # navigating: "You're in the wrong lane for your turn. Move one lane left."
    speeding: true          # "You're over the limit. It's 30 here." (the sign detector's limit + GPS speed)
    stop_sign: true         # "Stop sign ahead." while driving toward one
    car_ahead_wait_s: 2.0   # stopped this long behind the car before it pulls away...
    car_ahead_delay_s: 1.5  # ...and still stopped this long after it started moving
    wrong_lane_within_m: 800.0   # wrong-lane warnings within this far of the turn, after 2 s in the wrong lane
    speeding_margin_mph: 5.0     # over the limit by more than 5 mph for 4 s
    speeding_hold_s: 4.0

pedestrians:                # "Pedestrian stepping into the road on your right." (V2; state/pedestrians.py)
  half_width_m: 1.5         # our path: 1.5 m either side of where we're heading (half the car + a margin)...
  min_length_m: 6.0         # ...out to 6 m + 2 s at our speed (GPS; 8 m/s assumed when moving without a fix),
  headway_s: 2.0            #   at most 35 m; a cyclist riding ahead with us is closed in on slower: shorter
  max_length_m: 35.0
  min_speed_mps: 0.5        # GPS slower than this = not moving (people crossing while we wait are normal)
  confirm_frames: 3         # in (or stepping into) the path 3 observations in a row before a warning
  road_min_share: 0.3       # with the lanes model on: "in our path" only if >= 30 % of the ground at their feet is
  road_max_age_s: 0.3       #   drivable (a sidewalk isn't; stepping off it still warns), masks <= 0.3 s old,
  road_gate_min_offset_m: 0.9  #   and only >= 0.9 m from the path's middle (right ahead of us: always warned)
  predict_s: 1.2          # "stepping into the road": inside the path within 1.2 s at their sideways speed,
  predict_max_z_m: 15.0     #   predicted only within 15 m (further out, sideways speeds are mostly depth noise)
  height_weight: 0.5        # distance = box height and ground contact combined (the latter breaks on hills)
  max_tall_ratio: 1.4       # a "person" much taller than one standing there is a tree / pole: never warned of
  curvature_uncertainty: 0.0026  # the path bends with our turn rate less this (1/m); far out it narrows by it
  max_aim_deg: 12.0         # dashcams aimed off the car's axis: where we head is the focus of expansion

parking:                    # V2 "find me a parking spot" (state/parking.py geometry, answers/parking.py the watch)
  camera_height_m: 1.3      # windshield mount
  lot_pitch_m: 2.7          # stall spacing prior (the row's own spacing is measured)
  curb_pitch_m: 6.0         # parallel-parked spacing (street mode)
  scale_min: 0.75           # the field of view is trusted to within this range (measured from the stall pitch)
  scale_max: 1.35
  gap_ratio: 1.7            # spacing (in pitches) between parked cars that leaves a space
  min_visible_depth_m: 1.0  # a space is reported only once we see this deep into it past its nearer neighbour
  confirm_s: 0.7            # ...after it looked open this long while we approach
  min_parked_s: 0.5
  pull_out_min_m: 0.8       # "a car is pulling out": a parked car in a row moved this far toward our path
  lot_min_parked: 6         # parked cars seen in rows while we crawl: "looks like a parking lot" (offer, if
  lot_max_speed_mps: 4.5    #   the vision model agrees); ~10 mph: faster isn't looking for a spot
  parked_after_s: 10.0      # we've parked: stopped this long after a turn of parked_turn_deg (the watch ends)
  parked_turn_deg: 50.0
  watch_timeout_s: 300.0    # the user: stop looking after 5 minutes
  reply_window_s: 5.0       # after the lot offer, listen this long for a plain yes/no (no wake word)
  max_checks_per_min: 20    # vision-model checks of candidate spots

memory:                     # V2 "what was that sign?" (state/memory.py)
  keep_s: 60.0              # a frame a second and a close-up of each sign seen, for the last minute
  spacing_s: 1.0
  window_s: 15.0            # a memory question sends this many seconds of frames...
  frames: 5
  signs: 4                  # ...plus the most recent sign close-ups

lanes:                      # V2 YOLOPv2 lanes (perception/lanes.py) + lane tracker and drift warning (state/lanes.py)
  enabled: true
  fps: 12.0                 # the lane model runs at most this often, on the newest frame (its own thread)
  weights: models/lanes/yolopv2.pt  # official TorchScript release (github.com/CAIC-AD/YOLOPv2, MIT)
  half: true
  cuda_graph: true          # replay the forward pass as a CUDA graph (eager TorchScript is launch-bound here)
  max_view_deg: 70.0        # a wider camera (the phone's 114°) gives the lane model its center, cropped to 70°
  camera_height_m: 1.3      # only a prior: our own lane's measured width sets the metric scale
  camera_offset_m: 0.0      # camera right of the car's center line (left: negative)
  horizon_prior: 0.5        # horizon row / frame height until measured from the lines' vanishing point
  lane_width_m: 3.6         # nominal lane width (the scale); our lane must measure 2.6-4.6 m after that
  gap_min: 0.75             # a neighbouring lane is 0.75-1.3 of our lane's width...
  gap_max: 1.3
  edge_drivable_max: 0.35   # ...and the road ends at a line the drivable area doesn't reach past (by > 0.35 lanes)
  vote_window_s: 1.5        # lane count and index: the majority of the last 1.5 s (>= 5 frames, >= 70 %)
  min_speed_mps: 11.18      # PLAN.md: drift warnings only above 25 mph (GPS speed; no GPS = no warnings)
  habit_window_s: 120.0     # drift is measured from where we usually drive in the lane (camera mount + driver):
  habit_min_s: 8.0          #   the median over 2 min at speed; no drift warnings before 8 s of it
  drift_gap_m: 0.2          # "Careful, you're drifting right.": the car's side within 0.2 m of the line...
  drift_min_mps: 0.08       # ...closing in at 0.08-0.5 m/s (faster is a lane change: we can't see the signal)...
  lane_change_mps: 0.5
  drift_window_s: 2.5       # ...steadily for 2.5 s (toward it in 80 % of it), by at least 0.2 m
  drift_min_shift_m: 0.2
  cooldown_s: 10.0          # once per drift; re-armed back near the lane center or after a lane change
  drift_show_s: 4.0         # the page shows the drift (red line, edge pulse) this long after the alert

vision_model: claude       # scene-question provider: claude (Haiku, default) | gemini | ollama | mock
vision:
  frames: 3                 # latest frame at full width + 2 earlier, smaller ones (motion, things just passed)
  frame_spacing_s: 0.7
  sign_frame_spacing_s: 1.2 # "what did that sign say?": reach further back, at full width
  sign_closeups: 3          # sign questions also get close-ups of the signs the detectors saw in the last...
  sign_closeup_window_s: 5.0  # ...5 s (a 25 px DO NOT ENTER sign in the frame is unreadable; its close-up isn't)
  location: true            # "Location (from GPS): Bayside, Queens, New York City, New York." (rules depend on the city)
  location_refresh_m: 400.0 # looked up again (Mapbox reverse geocoding, in the background) after moving this far
  latest_width: 1280
  older_width: 640
  jpeg_quality: 80
  mark_objects: true        # V2: number the tracked objects on the latest frame; the answer's hidden [ref N]
  max_marks: 12             #   tag (checked against what the answer names) pulses that object on the page
  first_token_timeout_s: 3.0  # no words by then: a spoken "sorry" (PLAN target: answer audio within 2.5 s)
  total_timeout_s: 8.0
  time_override: null       # e.g. "Saturday 17:40" for replays and the test sheet (default: the real clock)
  temperature: 0.0          # 0 = most literal (fewer invented details); null for Claude models newer than
                            #   the 4.6 line, which reject it (the startup check would show it failing)
  claude:
    model: claude-haiku-4-5
    max_tokens: 300
    max_retries: 0          # a retry can't arrive in time; failures get a spoken fallback instead
    thinking: default       # default | disabled | adaptive (Haiku 4.5 doesn't think unless asked)
    effort: null            # low | medium | high (Haiku 4.5 rejects it)
  reading:                  # a second Claude model for sign, parking and "what's going on" questions; lights, lanes,
    model: claude-haiku-5-5 #   memory and go questions stay with vision.claude (null: one model for all). Measured
    thinking: disabled      #   2026-10-11: held-out questions 18/27 right vs 11 (Haiku 4.5) and 15 (Haiku 5.5) alone
    effort: low
    temperature: null       # (Haiku 5.5 rejects any but the default)
  gemini:
    model: gemini-3.8-flash
    thinking_level: low
    max_tokens: 300
  ollama:
    model: qwen2.5vl:7b     # note: a 7B vision model won't fit in 6 GB next to YOLO and Whisper
    host: http://localhost:11434
    timeout_s: 15.0

voice:
  input_device: null        # sounddevice name or index; null = system default
  output_device: null
  output_volume: 1.0        # 0-1; benchmarks run quieter
  wake_mode: hey_drivepilot # hey_drivepilot | hey (just "hey") | none (no wake word: any question is answered).
                            #   Also --wake on the command line, or Settings on the page while running.
  open_mic:                 # the "hey" and "none" modes: speech itself starts a question
    echo_tail_s: 0.6        # DrivePilot's own voice in the mic: ignored while it talks and this long after
    only_questions: true    # "none": only questions and commands are answered, not every remark in the car
  wakeword:                 # "Hey DrivePilot" (openWakeWord model trained by scripts/wakeword)
    model: models/wakeword/hey_drivepilot.onnx
    threshold: 0.15         # real voices (scripts/wakeword/check_real.py): 0.25 missed clear takes; still 0
                            #   false wakes per hour on 21 h of speech + car noise down to 0.10 (metrics.json)
    debounce_s: 2.0
  endpoint:                 # when the question has ended (Silero VAD)
    speech_threshold: 0.5
    end_silence_s: 0.5      # PLAN.md says ~0.6 s; 0.5 keeps local answers under 1 s and cut off none of the real takes
    speculative_silence_s: 0.25  # start transcribing early; kept if the silence lasts
    no_speech_timeout_s: 4.0
    wake_tail_s: 0.4         # speech this soon after the wake word may be just "...pilot": then the question
    wake_pause_s: 1.2        #   ends only after 1.2 s of silence (a pause before the question isn't its end)
    max_utterance_s: 10.0
    pre_roll_s: 1.5         # the whole wake phrase goes to Whisper (a cut one garbles the question's first word)
  stt:                      # faster-whisper on the GPU
    model: small.en
    device: cuda
    compute_type: float16
    beam_size: 1
    max_new_tokens: 64      # questions are short; bounds decode time
  tts:                      # Piper; alerts are pre-rendered clips
    voice: models/piper/en_US-lessac-medium.onnx
    length_scale: 0.95
    clips_dir: models/piper/clips
    chime_volume: 0.25
    listen_chime: true

ui:
  host: 127.0.0.1
  port: 8000
  overlays: true            # V2 page (boxes, badges, banner); false = the plain V1 page (also at /v1)
  video_fps: 30.0
  highlight_s: 2.0          # the object an answer is about pulses this long

logging:
  level: INFO
  runs_dir: runs            # each run writes frames, detections, questions, answers and timings here
  frame_log_interval_s: 1.0

signs:                      # V2-M6 fine-tuned US sign detector (perception/signs.py; scripts/signs/README.md)
  weights: models/signs/signs_yolo26s.pt          # detector (13 MUTCD kinds); engine built next to it
  classifier_weights: models/signs/speed_value_cls.pt  # speed-limit value (5-85 mph) or "none"
  engine: tensorrt          # tensorrt | pytorch (eager, much slower on Windows)
  device: 0
  half: true
  imgsz: [736, 1280]        # whole frame at 1280 px wide: distant signs stay ~15-40 px tall
  classifier_imgsz: 96
  conf: 0.4                 # minimum detection confidence (per-kind overrides in class_conf)
  class_conf: {}
  iou: 0.6
  value_conf: 0.9           # a speed value is reported only if every view reads it at this probability (validation + tune),
  value_min_px: 16.0        # only for signs at least this tall (pixels at 1280 px frame width)
  value_edge_px: 2.0        # and not for signs touching the frame border (the number may be cut off)
  duplicate_iou: 0.6        # one sign reported as two kinds (speed_limit + school_speed_limit): keep the surer one
  value_views: 5            # crops of a speed sign (shifted/scaled) that must all read the same value, each >= value_conf

sign_alerts:                # what the sign detector's readings turn into (state/signs.py)
  enabled: true             # run the sign detector (if its models are installed) and announce
  fps: 4.0                  # on the latest frame, this often
  min_conf: 0.5             # weaker detections are ignored
  link_s: 1.0               # a sign seen again within this long is the same sign
  keep_s: 60.0
  agree_frames: 2           # frames that must agree on a limit (or see a school-zone sign) before it is said...
  agree_window_s: 2.0       # ...within this long (one frame can be a look-alike)
  repeat_s: 300.0           # the same school limit again within this long: quiet
  zone_gap_s: 120.0         # "School zone ahead." once per zone: a zone ends after 2 min without a school sign
  recent: 6
